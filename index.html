.question {

// LESSON LIST

function showLessons() {
    let html = `
    <div class="card">
        <h2>📚 Python Lessons A to Z</h2>

        <div class="lesson-list">`;

    lessons.forEach((lesson, index) => {
        html += `

            <span>${lesson.title}</span>

    });

    html += `</div></div>`;
    app.innerHTML = html;
}

// OPEN INDIVIDUAL LESSON

function openLesson(index) {
    currentLesson = index;
    const lesson = lessons[index];

    app.innerHTML = `
    <div class="card">
        <p>Lesson ${index+1} of ${lessons.length}</p>
        <div class="progress-bg">
            <div class="progress" style="width:${(index+1)/lessons.length*100}%"></div>
        </div>

        <h2>${lesson.title}</h2>
        <h3>📖 Explanation</h3>
        <p>${lesson.desc}</p>

        <h3>💻 Code Example</h3>
        <pre>${escapeHTML(lesson.code)}</pre>

        <h3>🧠 Understand the Code</h3>
        <p>${lesson.explain}</p>

        <h3>✍️ Practice Questions</h3>

        ${lesson.questions.map((q,i)=>`
            <div class="question">
                <b>Q${i+1}. ${q}</b>
                <input id="answer${i}" placeholder="Type your answer">
                <p id="feedback${i}" class="feedback"></p>
            </div>
        `).join("")}

        <button onclick="checkAnswers()">Check Answers</button>
        <p id="score"></p>
        <br>

        <button onclick="showLessons()">All Lessons</button>
        <button onclick="previousLesson()" ${index===0?"disabled":""}>Previous</button>
        <button onclick="nextLesson()" ${index===lessons.length-1?"disabled":""}>Next Lesson →</button>
    </div>`;
}

// PROTECT CODE EXAMPLES IN HTML

function escapeHTML(value) {
    return value.replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[char]);
}

// CHECK PRACTICE ANSWERS

function checkAnswers() {
    const lesson = lessons[currentLesson];
    let score = 0;

    lesson.answers.forEach((answer,i) => {
        let userAnswer = document.getElementById("answer"+i).value
            .trim().toLowerCase();

        let correctAnswer = answer.toLowerCase();

        if(userAnswer === correctAnswer) {
            score++;
            document.getElementById("feedback"+i).innerText = "✅ Correct!";
            document.getElementById("feedback"+i).style.color = "green";
        } else {
            document.getElementById("feedback"+i).innerText =
                "❌ Try again. Review the lesson explanation.";
            document.getElementById("feedback"+i).style.color = "red";
        }
    });

    document.getElementById("score").innerText =
        "Your Score: " + score + " / " + lesson.answers.length;

    if(score === lesson.answers.length) {
        if(!completed.includes(currentLesson)) {
            completed.push(currentLesson);
        }
        document.getElementById("score").innerText += " 🎉 Lesson Completed!";
    }
}

// NAVIGATION

function nextLesson() {
    if(currentLesson < lessons.length-1) {
        openLesson(currentLesson+1);
    }
}

function previousLesson() {
    if(currentLesson > 0) {
        openLesson(currentLesson-1);
    }
}

// START WEBSITE

showHome();

</script>
